twig:
    file_name_pattern: '*.twig'
    # As 24 projects: the bricks impose the theme of Crudit whatever this one (lot 3.2.a)
    form_themes: ['bootstrap_5_layout.html.twig']
    globals:
        app_name: '%env(APP_NAME)%'
        app_version: '%env(APP_VERSION)%'
        # Connect of 2le: the user menu links to <connect_url>profile (add_connect_profile_link)
        connect_url: 'https://connect.example.org/'

when@test:
    twig:
        strict_variables: true

