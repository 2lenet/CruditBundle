name: Test application

# The bundle is installed as a project does (path repository, symlink: false) in a Symfony application: SQLite, one
# entity, a menu with every kind of element. There is one application per way a project delivers the assets:
#   - crudit: AssetMapper. PHPUnit drives its pages (layout, menu, CRUD), then headless browsers drive the JavaScript
#     and check accessibility with axe-core (tests/apps/smoke.mjs). The browsers are Playwright's (tests/apps/browser.mjs):
#     Chromium and WebKit on a desktop, Safari on an iPhone, Chrome on an Android phone; the same test runs on each;
#   - encore: the same code built with Webpack Encore, the same smoke test;
#   - turbo: the same code with Symfony UX Turbo, the same smoke test, then the screens under real Turbo visits
#     (tests/apps/smoke-turbo.mjs).
# turbo and encore share the code (src/) of crudit. A lot that reworks a screen adds its cases to crudit and to the smoke
# tests.

on:
    push:
        branches: [main, feature/redesign]
    pull_request:
        branches: [main, feature/redesign]

jobs:
    app:
        name: "${{ matrix.app }} (${{ matrix.env }})"

        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   {app: crudit, env: dev}
                    -   {app: crudit, env: prod}
                    -   {app: encore, env: dev}
                    -   {app: encore, env: prod}
                    -   {app: turbo, env: dev}
                    -   {app: turbo, env: prod}

        env:
            APP_SECRET: ci
            APP_ENV: ${{ matrix.env }}

        defaults:
            run:
                working-directory: tests/apps/${{ matrix.app }}

        steps:
            -   uses: actions/checkout@v7

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: composer:v2
                    extensions: intl

            -   uses: actions/setup-node@v7
                with:
                    node-version: 22

            # The bundle is copied into vendor/ (path repository, symlink: false), as a project does.
            -   name: 'Install the application'
                run: composer install --no-interaction --prefer-dist

            # Not committed: imported as a project does before committing, which also tests the Finder.
            -   name: 'Import the icons'
                run: php bin/console ux:icons:lock

            -   name: 'Import the JavaScript packages (AssetMapper)'
                if: matrix.app != 'encore'
                run: php bin/console importmap:install

            -   name: 'Install the assets of the bundles'
                run: php bin/console assets:install public

            # The packages of the bundles are those copied into vendor/ (file:vendor/2lenet/...).
            # `encore dev` (source maps, no versioning) is the build a developer runs every day; `encore production` the deployed one.
            -   name: 'Build the assets (Encore)'
                if: matrix.app == 'encore'
                run: |
                    npm install --no-audit --no-fund
                    npm run ${{ matrix.env == 'prod' && 'build' || 'dev' }}

            -   name: 'Database'
                run: php bin/console app:seed

            -   name: 'PHPUnit'
                if: matrix.app == 'crudit'
                run: APP_ENV=test php bin/console app:seed && vendor/bin/phpunit

            -   name: 'Compile the assets (AssetMapper, production)'
                if: matrix.app != 'encore' && matrix.env == 'prod'
                run: php bin/console asset-map:compile

            -   name: 'Start the server'
                run: |
                    php bin/console cache:warmup
                    php -S 127.0.0.1:8080 -t public > /tmp/server.log 2>&1 &
                    npx --yes wait-on http://127.0.0.1:8080/ --timeout 30000

            # Playwright: Chromium and WebKit with their system libraries (tests/apps/browser.mjs).
            -   name: 'Install the browsers'
                working-directory: tests/apps
                run: |
                    npm install --no-audit --no-fund
                    npx playwright install --with-deps chromium webkit

            # The same test on every project: Chrome and Safari on a desktop, Safari on an iPhone, Chrome on Android.
            # The test changes the data (a workflow transition): the database is built again before each run.
            -   name: 'Smoke test'
                working-directory: tests/apps
                run: |
                    failed=0
                    for project in chromium webkit iphone pixel; do
                        echo "::group::smoke $project"
                        (cd ${{ matrix.app }} && php bin/console app:seed) && node smoke.mjs http://127.0.0.1:8080/ $project || failed=1
                        echo "::endgroup::"
                    done
                    exit $failed

            -   name: 'Smoke test under Turbo'
                if: matrix.app == 'turbo'
                working-directory: tests/apps
                run: |
                    failed=0
                    for project in chromium webkit iphone pixel; do
                        echo "::group::smoke-turbo $project"
                        (cd ${{ matrix.app }} && php bin/console app:seed) && node smoke-turbo.mjs http://127.0.0.1:8080/ $project || failed=1
                        echo "::endgroup::"
                    done
                    exit $failed

            -   name: 'Server log'
                if: failure()
                run: cat /tmp/server.log
